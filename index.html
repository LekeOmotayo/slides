<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leke Sliding Window Limiter — Senior Architecture Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <!-- Fallback local css link for static file viewing without web server -->
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div>
        <div class="brand-badge">
          <span class="status-dot"></span>
          <span>Go 1.25 Standard Library Concurrency</span>
        </div>
        <h1>Sliding Window Rate Limiter & Token Budget Engine</h1>
        <p class="subtitle">Thread-safe Sliding Window Log, Cloudflare O(1) Counter, and Multi-Tenant Token Bucket for LLM TPM & RPM rate governance.</p>
      </div>
      <div class="header-meta">
        <span id="engineModeBadge" class="mode-badge">Checking Engine...</span>
      </div>
    </header>

    <!-- Visual Sliding Horizon -->
    <div id="timelineMount"></div>

    <!-- Main 2-Column Grid -->
    <main class="main-grid">
      <!-- Column 1: Controls & Benchmark -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div id="generatorMount"></div>
        <div id="benchmarkMount"></div>
      </div>

      <!-- Column 2: Status Gauge, RFC Headers & Live Logs -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div id="gaugeMount"></div>
        <div id="headersMount"></div>

        <!-- Event Log -->
        <div class="card">
          <div class="card-title">
            <span>Live Audit Event Stream</span>
            <span class="tag">Real-Time Ingestion</span>
          </div>
          <div id="eventLogStream" class="event-log"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modular Component Scripts -->
  <script type="module" src="/static/js/app.js"></script>
  <!-- Fallback script path for direct file:// browsing -->
  <script type="module" src="static/js/app.js"></script>
</body>
</html>
